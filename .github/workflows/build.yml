name: build

on:
  push:
  pull_request:

jobs:
  linux:
    name: portable headers and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: build and test
        run: make strict

  dll:
    name: cross build the proxy
    runs-on: ubuntu-latest
    steps:
      # The proxy stamps git describe into its wrap-time log line, and a
      # shallow tagless checkout would stamp "unknown".
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: install the cross compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - name: build the proxy and its test
        run: make strict dll
      - name: upload the proxy
        uses: actions/upload-artifact@v7
        with:
          name: proxy-windows
          path: |
            build/bin/t150-dinput8.dll
            build/bin/dll_check.exe
            build/bin/probe_dinput.exe
          if-no-files-found: error

  windows:
    name: run the proxy on Windows
    needs: dll
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: proxy-windows
      # The proxy chain-loads the real implementation from a copy beside it.
      # On Windows that copy is the system dinput8; in a bottle it is
      # CrossOver's builtin. Loading it here is the only place the chain-load
      # runs against a real loader before the Mac.
      - name: put the real dinput8 where the proxy looks for it
        shell: pwsh
        run: Copy-Item $env:SystemRoot\System32\dinput8.dll .\dinput8_orig.dll
      - name: check the proxy
        shell: pwsh
        run: .\dll_check.exe .\t150-dinput8.dll
      # probe_dinput is handed to a person with a wheel and one session to
      # spend, so a fault on the way to the first line of output costs a whole
      # session. No runner has a wheel, but everything before the wheel is
      # found is the same here as on the Mac: the imports resolve, the proxy
      # loads, COM starts, DirectInput8Create goes through the proxy and
      # EnumDevices runs. That is the whole startup path.
      - name: the probe starts and reaches the point where a wheel would be
        shell: pwsh
        run: |
          Copy-Item .\t150-dinput8.dll .\dinput8.dll
          $log = Join-Path $env:RUNNER_TEMP "probe.log"
          $out = & .\probe_dinput.exe -o $log 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 1) {
              throw "probe_dinput exited $code, expected 1 (no wheel attached)"
          }
          if ($out -notmatch "no T150 found") {
              throw "probe_dinput did not reach device enumeration"
          }
          if (-not (Test-Path $log)) { throw "probe_dinput wrote no log" }
          exit 0
      - name: an unknown flag is refused rather than ignored
        shell: pwsh
        run: |
          & .\probe_dinput.exe --nonsense 2>&1 | Out-String | Write-Host
          if ($LASTEXITCODE -ne 2) {
              throw "usage exit was $LASTEXITCODE, expected 2"
          }
          exit 0

  wine:
    name: run the probe under Wine
    needs: dll
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: proxy-windows
      - name: install wine
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine libsdl2-2.0-0
          wine --version
      # Without a wheel the probe stops at "no T150 found", which leaves
      # everything that has ever gone wrong in it untested. A uinput device
      # carrying the wheel's real ids gets Wine to hand the probe a device to
      # describe, so the enumeration and the state reads run here.
      - name: attach a wheel shaped device
        run: |
          sudo modprobe uinput
          cc -Wall -Wextra -std=c11 -D_POSIX_C_SOURCE=200809L \
              -o "$RUNNER_TEMP/fake_wheel" tests/fake_wheel.c
          sudo chmod 666 /dev/uinput
          # Wine opens the event node O_RDWR, so read access is not enough
          # and a device it cannot open for writing is skipped without a
          # word. The rule has to be in place before the device exists,
          # because udev sets the mode back when it processes it.
          echo 'KERNEL=="event*", MODE="0666"' |
              sudo tee /etc/udev/rules.d/99-fake-wheel.rules
          sudo udevadm control --reload-rules
          "$RUNNER_TEMP/fake_wheel" &
          echo "FAKE_WHEEL_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 20); do
              test -n "$(grep -l 'T150' /sys/class/input/*/device/name \
                  2>/dev/null)" && break
              sleep 1
          done
          grep -l "T150" /sys/class/input/*/device/name ||
              { echo "the fake wheel never appeared" >&2; exit 1; }
          sudo udevadm settle
          ls -l /dev/input/event*
      # A CrossOver bottle is a Wine prefix, and CrossOver 26 is Wine 11, so
      # this is the only place outside the Mac where the probe meets the
      # loader that will actually run it. Installing the proxy the way the
      # bottle installs it, over dinput8 with the builtin renamed beside it,
      # means the chain load is exercised too.
      - name: install the proxy into a prefix the way a bottle does
        env:
          WINEPREFIX: ${{ runner.temp }}/prefix
          WINEARCH: win64
          WINEDEBUG: -all
        run: |
          wineboot -i
          wineserver -w
          sys="$WINEPREFIX/drive_c/windows/system32"
          builtin=$(find /usr/lib -path '*x86_64-windows/dinput8.dll' |
              head -n 1)
          test -n "$builtin" || { echo "no builtin dinput8" >&2; exit 1; }
          cp "$builtin" "$sys/dinput8_orig.dll"
          cp t150-dinput8.dll "$sys/dinput8.dll"
          cp probe_dinput.exe "$WINEPREFIX/drive_c/"
      # dinput8=n so the file just installed is the one that loads, rather
      # than Wine's own builtin: the proxy is the thing being tested.
      - name: the probe describes the wheel
        env:
          WINEPREFIX: ${{ runner.temp }}/prefix
          WINEDEBUG: -all
          WINEDLLOVERRIDES: dinput8=n
        run: |
          set +e
          out=$(wine "C:\\probe_dinput.exe" -o "Z:$RUNNER_TEMP/probe.log" 2>&1)
          code=$?
          set -e
          printf '%s\n' "$out"
          case "$out" in
          *"Unhandled exception"*|*"page fault"*)
              echo "probe_dinput faulted under Wine" >&2; exit 1 ;;
          *"no T150 found"*)
              echo "Wine never saw the fake wheel" >&2; exit 1 ;;
          esac
          test "$code" -eq 0 ||
              { echo "exited $code, expected 0" >&2; exit 1; }
          test -f "$RUNNER_TEMP/probe.log" ||
              { echo "wrote no log" >&2; exit 1; }
          # The fake wheel has thirteen buttons, so every one of them has to
          # land in the button block of the state struct. This is the check
          # that would have caught reading them at the enumeration offset,
          # which lands somewhere else entirely and can go negative.
          n=$(grep -c 'rgbButtons\[' "$RUNNER_TEMP/probe.log" || true)
          test "$n" -eq 13 ||
              { echo "$n buttons mapped into the state, expected 13" >&2
                exit 1; }
          ! grep -q "NOT READABLE" "$RUNNER_TEMP/probe.log" ||
              { echo "a control has no slot in the state" >&2; exit 1; }
      # The identification walk is where the offsets are turned into
      # positions in the state struct, and it is the half a runner could
      # never reach before. Nothing moves, so every control comes back "not
      # seen"; what is being checked is that it survives asking. The runner
      # has no one to answer with: no stdin and no display, so every row
      # must say NEVER ANSWERED, which is the proof the tool no longer
      # agrees with itself when nobody is there. The timeout is the guard
      # against the opposite failure, a question that waits forever in a
      # place with no one to answer it.
      - name: the probe walks every control without faulting
        timeout-minutes: 10
        env:
          WINEPREFIX: ${{ runner.temp }}/prefix
          WINEDEBUG: -all
          WINEDLLOVERRIDES: dinput8=n
        run: |
          set +e
          out=$(wine "C:\\probe_dinput.exe" -i \
              -o "Z:$RUNNER_TEMP/ident.log" < /dev/null 2>&1)
          code=$?
          set -e
          printf '%s\n' "$out"
          case "$out" in
          *"Unhandled exception"*|*"page fault"*)
              echo "probe_dinput faulted walking the controls" >&2; exit 1 ;;
          esac
          test "$code" -eq 0 ||
              { echo "exited $code, expected 0" >&2; exit 1; }
          grep -q "what this wheel is" "$RUNNER_TEMP/ident.log" ||
              { echo "never printed the table" >&2; exit 1; }
          n=$(grep -c '\[NEVER ANSWERED\]' "$RUNNER_TEMP/ident.log" || true)
          test "$n" -eq 21 ||
              { echo "$n rows marked never answered, expected all 21:" \
                    "the walk invented answers nobody gave" >&2; exit 1; }
      # Every step above got the builtin device back. The proxy only wraps
      # the wheel when a daemon answers, so nothing above ever entered the
      # wrapper, and that is how a device claiming force feedback with no
      # actuator axis survived four releases. The daemon runs on Linux in
      # log-only mode, so the whole wrapper can be exercised here with no
      # wheel and no Mac. This step also leaves the log path to the tool,
      # which is the only check that the per-mode default names work.
      - name: the proxy wraps the wheel when a daemon answers
        timeout-minutes: 10
        env:
          WINEPREFIX: ${{ runner.temp }}/prefix
          WINEDEBUG: -all
          WINEDLLOVERRIDES: dinput8=n
          # The proxy says nothing at all without this, so the line that
          # proves it wrapped the wheel would be missing and the check for
          # it would fail on a run that worked. It also puts the proxy's
          # own logging on the tested path rather than the assumed one.
          T150_DEBUG: "1"
        run: |
          rm -f /tmp/probe_dinput-dump.log
          # This job downloads the Windows artifacts and builds nothing, so
          # the daemon it needs has to be built here. It drives no hardware
          # in this mode, which is why it can run on a runner at all.
          make daemon
          ./build/bin/t150d -n -v -e "$RUNNER_TEMP/ffb-endpoint" &
          daemon=$!
          for i in $(seq 1 50); do
              test -s "$RUNNER_TEMP/ffb-endpoint" && break
              sleep 0.2
          done
          test -s "$RUNNER_TEMP/ffb-endpoint" ||
              { echo "the daemon published no endpoint" >&2
                kill $daemon; exit 1; }
          set +e
          export T150_ENDPOINT="Z:$RUNNER_TEMP/ffb-endpoint"
          out=$(wine "C:\\probe_dinput.exe" < /dev/null 2>&1)
          code=$?
          set -e
          kill $daemon 2>/dev/null || true
          wait $daemon 2>/dev/null || true
          printf '%s\n' "$out"
          test "$code" -eq 0 ||
              { echo "exited $code, expected 0" >&2; exit 1; }
          case "$out" in
          *"wrapped the wheel"*) ;;
          *) echo "the proxy never wrapped the wheel, so nothing below" \
                 "this was actually tested" >&2; exit 1 ;;
          esac
          log=/tmp/probe_dinput-dump.log
          test -f "$log" ||
              { echo "the default log name was not used" >&2; exit 1; }
          grep -q "^dinput8     the proxy" "$log" ||
              { echo "the run does not record that the proxy answered" >&2
                exit 1; }
          grep -q "force feedback claimed" "$log" ||
              { echo "the wrapped device did not claim force feedback" >&2
                exit 1; }
          # The whole point of marking an actuator: without it SDL builds
          # effects with no axes at all. RESEARCH.md B13.
          grep -q "force feedback actuator\]" "$log" ||
              { echo "no axis is marked as a force feedback actuator" >&2
                exit 1; }
          ! grep -q "and the device claims" "$log" ||
              { echo "the tool still reports the claim as contradicted" >&2
                exit 1; }

  macos:
    name: probe tools
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: build everything
        run: make strict
      - name: confirm the probes run
        # No wheel is attached to a CI runner, so the only thing that can be
        # checked here is that each tool starts, parses arguments and exits
        # cleanly rather than crashing. probe_hid reports zero matches and
        # succeeds; the other two are expected to fail with "no device", so
        # only their usage path is exercised.
        run: |
          ./build/bin/probe_hid
          ./build/bin/probe_setreport -h || test $? -eq 2
          ./build/bin/probe_ep0 -h || test $? -eq 2
          ./build/bin/probe_intr -h || test $? -eq 2
      - name: confirm the tools run
        # No wheel on a runner, so t150ctl can only be checked as far as
        # "no wheel at 044f:b677", and t150boot is expected to find nothing
        # at the boot id and exit 0, which is the state it must tolerate.
        run: |
          ./build/bin/t150ctl -h || test $? -eq 2
          ./build/bin/t150ctl status || test $? -eq 1
          ./build/bin/t150boot
      - name: confirm the daemon starts on its real backend
        # No wheel on a runner, so this proves only that the HID backend
        # initialises, walks the registry, finds nothing and keeps going
        # rather than failing or crashing. That is the one thing about it
        # that can be checked without hardware.
        run: |
          ./build/bin/t150d -v -e "$RUNNER_TEMP/endpoint" &
          pid=$!
          sleep 2
          # While it is still up: it removes the endpoint on the way out.
          grep -q . "$RUNNER_TEMP/endpoint" ||
              { echo "the daemon published no endpoint" >&2; kill $pid; exit 1; }
          kill -TERM $pid
          wait $pid || test $? -eq 143
          test ! -e "$RUNNER_TEMP/endpoint" ||
              { echo "the daemon left its endpoint behind" >&2; exit 1; }
      - name: upload the macOS binaries
        uses: actions/upload-artifact@v7
        with:
          name: macos
          path: |
            build/bin/probe_hid
            build/bin/probe_setreport
            build/bin/probe_ep0
            build/bin/probe_intr
            build/bin/t150ctl
            build/bin/t150boot
            build/bin/t150d
          if-no-files-found: error
